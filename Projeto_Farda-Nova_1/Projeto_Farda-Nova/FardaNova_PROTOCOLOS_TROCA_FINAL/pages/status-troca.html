<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Farda Nova | Status da Troca</title><link rel="stylesheet" href="../css/style.css"></head>
<body><header class="topbar"><a class="brand" href="../dashboard.html"><span>FARDA</span> NOVA</a><a class="back-link" href="servicos.html">← Portal do Colaborador</a></header>
<main class="form-page"><section class="form-container"><div class="section-heading"><span class="tag">PORTAL DO COLABORADOR</span><h1>Status da Troca de Peça</h1><p>Consulte o protocolo, as peças solicitadas, a quantidade, a data e o andamento.</p></div>
<div id="statusTrocaContent" class="result-box" aria-live="polite"></div>
<div class="form-footer"><a class="btn btn-primary" href="troca.html">Solicitar Nova Troca</a><a class="btn btn-secondary" href="servicos.html">Voltar ao Portal</a></div></section></main><footer><p>Farda Nova &copy; 2026 — Projeto Acadêmico Front-End</p></footer>
<script>(function(){function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}function read(){let s=null;try{s=JSON.parse(localStorage.getItem('fardaNovaTroca')||'null')}catch(e){} if(s&&s.protocolo)return s;const proto=localStorage.getItem('fardaNovaUltimoProtocoloTroca');if(!proto)return null;let pecas=[];try{pecas=JSON.parse(localStorage.getItem('fardaNovaPecasTroca')||'[]')}catch(e){}return {protocolo:proto,status:localStorage.getItem('fardaNovaStatusTroca')||'Aguardando análise do RH',data:localStorage.getItem('fardaNovaUltimaDataTroca')||'—',motivo:localStorage.getItem('fardaNovaMotivoTroca')||'—',peças:pecas};}if(localStorage.getItem('fardaNovaLogado')!=='true'){location.href='../index.html';return;}const el=document.getElementById('statusTrocaContent');const s=read();if(!s){el.innerHTML='<h3>📋 Status da Solicitação de Troca</h3><div class="feature-data"><p><strong>Protocolo:</strong> Nenhuma solicitação registrada.</p><p><strong>Status:</strong> Nenhuma solicitação registrada.</p><p><strong>Data:</strong> —</p></div><p>Registre uma troca para gerar o protocolo TR.</p>';return;}const list=(s.peças||[]).map(x=>'<li><strong>'+esc(x.quantidade||1)+' ×</strong> '+esc(x.peça||'Peça não informada')+'</li>').join('')||'<li>Nenhuma peça informada.</li>';el.innerHTML='<h3>✓ Solicitação de Troca Registrada</h3><div class="feature-data"><p><strong>Protocolo da troca:</strong> '+esc(s.protocolo)+'</p><p><strong>Status:</strong> '+esc(s.status)+'</p><p><strong>Data da solicitação:</strong> '+esc(s.data)+'</p><p><strong>Motivo:</strong> '+esc(s.motivo)+'</p></div><h4>Peças solicitadas</h4><ul class="item-list">'+list+'</ul><p style="color:#315d24;font-weight:700">✓ Esta solicitação está disponível para consulta pelo protocolo.</p>';})();</script></body></html>
